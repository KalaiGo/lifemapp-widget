name: Android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public client config (the anon key is the same one the web app ships to browsers)
      LIFEMAPP_SUPABASE_URL: ${{ vars.LIFEMAPP_SUPABASE_URL }}
      LIFEMAPP_SUPABASE_ANON_KEY: ${{ vars.LIFEMAPP_SUPABASE_ANON_KEY }}
      LIFEMAPP_WEB_URL: ${{ vars.LIFEMAPP_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (crypto parity, data, widgets)
        run: ./gradlew test --stacktrace
      - name: Lint
        run: ./gradlew lintDebug
      - name: Assemble
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/
